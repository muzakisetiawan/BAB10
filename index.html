<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>和 Flashcards — Belajar Bahasa Jepang N5 (Bab 10, 11, 12)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --gap: 12px;
    --ease: cubic-bezier(.22,.9,.3,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:#e8e2da;
    font-family:'Poppins','Noto Sans JP',sans-serif;
  }
  button{ font:inherit; }

  /* ============ FURIGANA STYLING ============ */
  ruby { ruby-align: center; }
  rt { font-size: 0.58em; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; color: var(--accent-indigo); letter-spacing: 0; line-height: 1; }

  /* ============ THEME TOKENS ============ */
  .app{
    --bg-sky-top: #ffe7ec;
    --bg-sky-mid: #fff1ea;
    --bg-sky-bot: #fdf7f0;
    --ink: #2b241f;
    --ink-soft: #7a6d64;
    --ink-faint: #a89a90;
    --card-bg: #ffffff;
    --card-bg-soft: #fffaf6;
    --card-border: rgba(43,36,31,0.08);
    --accent-sakura: #e78fa6;
    --accent-sakura-deep: #d1637e;
    --accent-indigo: #3d5a78;
    --accent-gold: #c69657;
    --fuji-fill: #b7c3da;
    --fuji-snow: #ffffff;
    --hill-fill: #cdd9c9;
    --tower-color: #9fb0c9;
    --tower-glow: transparent;
    --shadow-soft: 0 14px 34px rgba(70,45,40,0.10);
    --shadow-card: 0 18px 40px rgba(70,45,40,0.14);
    --color-correct: #4f9d6e;
    --color-wrong: #c65c56;
    --sun-op: 1; --moon-op: 0; --star-op: 0; --bird-op: .55;
    --transition: background .5s var(--ease), color .5s var(--ease), border-color .5s var(--ease);
  }
  .app[data-theme="dark"]{
    --bg-sky-top: #171a30;
    --bg-sky-mid: #10101f;
    --bg-sky-bot: #0b0b14;
    --ink: #f2ede4;
    --ink-soft: #b6aec2;
    --ink-faint: #6c6480;
    --card-bg: #1b1d30;
    --card-bg-soft: #20223a;
    --card-border: rgba(244,239,231,0.09);
    --accent-sakura: #e6a3b8;
    --accent-sakura-deep: #f0b6c7;
    --accent-indigo: #9fc0e8;
    --accent-gold: #e3c283;
    --fuji-fill: #232544;
    --fuji-snow: #3a3c66;
    --hill-fill: #191a30;
    --tower-color: #cba15f;
    --tower-glow: #ffd98a;
    --shadow-soft: 0 14px 34px rgba(0,0,0,0.45);
    --shadow-card: 0 18px 44px rgba(0,0,0,0.55);
    --color-correct: #7fd9a0;
    --color-wrong: #f08a86;
    --sun-op: 0; --moon-op: 1; --star-op: 1; --bird-op: 0;
  }

  /* ============ SHELL ============ */
  .app{
    position:relative; width:100%; max-width:440px; min-height:100dvh;
    overflow-x:hidden; overflow-y:auto;
    background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-mid) 45%, var(--bg-sky-bot) 100%);
    color:var(--ink); transition:var(--transition);
    box-shadow: 0 0 60px rgba(0,0,0,0.18);
  }
  .scenery{ position:absolute; top:0; left:0; right:0; height:210px; overflow:hidden; pointer-events:none; z-index:0; }
  .scenery svg{ width:100%; height:100%; display:block; }
  .scenery .sun-disc{ opacity:var(--sun-op); transition:opacity .6s var(--ease); }
  .scenery .moon-disc{ opacity:var(--moon-op); transition:opacity .6s var(--ease); }
  .scenery .stars{ opacity:var(--star-op); transition:opacity .6s var(--ease); }
  .scenery .birds{ opacity:var(--bird-op); transition:opacity .6s var(--ease); }
  .scenery .fuji-body{ fill:var(--fuji-fill); transition:fill .5s var(--ease); }
  .scenery .fuji-snow{ fill:var(--fuji-snow); transition:fill .5s var(--ease); }
  .scenery .hill{ fill:var(--hill-fill); transition:fill .5s var(--ease); }
  .scenery .tower-lines{ stroke:var(--tower-color); transition:stroke .5s var(--ease); }

  .petals{ position:absolute; inset:0; height:340px; z-index:1; pointer-events:none; overflow:hidden; }
  .petal{ position:absolute; top:-10%; width:9px; height:9px; background:var(--accent-sakura); border-radius:0 100% 0 100%; opacity:.7; animation: fall linear infinite; transition: background .5s var(--ease); }
  @keyframes fall{ 0%{ transform: translate(0,0) rotate(0deg);} 100%{ transform: translate(var(--drift,30px), 320px) rotate(340deg);} }

  /* ============ TOPBAR ============ */
  .content{ position:relative; z-index:2; padding: 18px 16px 34px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{ font-family:'Noto Sans JP',sans-serif; font-size:11px; letter-spacing:.14em; font-weight:600; color:var(--ink-soft); text-transform:uppercase; }
  .brand .title{ display:flex; align-items:baseline; gap:8px; font-family:'Zen Kaku Gothic New','Poppins',sans-serif; font-weight:900; font-size:22px; color:var(--ink); }
  .brand .rule{ width:34px; height:3px; border-radius:2px; margin-top:4px; background: linear-gradient(90deg, var(--accent-gold), var(--accent-sakura)); }

  .theme-toggle{ position:relative; width:60px; height:32px; border-radius:999px; border:1px solid var(--card-border); background:var(--card-bg); box-shadow: var(--shadow-soft); cursor:pointer; display:flex; align-items:center; padding:3px; transition:var(--transition); flex-shrink:0; }
  .theme-toggle .knob{ width:24px; height:24px; border-radius:50%; background: linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); display:flex; align-items:center; justify-content:center; transform: translateX(0); transition: transform .4s var(--ease); box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .app[data-theme="dark"] .theme-toggle .knob{ transform: translateX(28px); }
  .theme-toggle .knob svg{ width:14px; height:14px; }
  .theme-toggle .icon-static{ position:absolute; }
  .theme-toggle .icon-static.sun{ left:8px; } .theme-toggle .icon-static.moon{ right:7px; }
  .theme-toggle .icon-static svg{ width:14px; height:14px; opacity:.55; }
  .theme-toggle .icon-static.sun svg{ stroke:var(--accent-gold); }
  .theme-toggle .icon-static.moon svg{ stroke:var(--accent-indigo); }

  /* ============ SCREEN TRANSITION ============ */
  .screen-inner{ animation: screenIn .38s var(--ease); }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  /* ============ BENTO BASE ============ */
  .bento-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .bento{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-soft); transition:var(--transition); }
  .span-2{ grid-column: 1 / -1; }

  .stat-tile{ padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; }
  .stat-tile .icon-wrap{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; background: linear-gradient(155deg, rgba(198,150,87,.16), rgba(231,143,166,.16)); }
  .stat-tile .icon-wrap svg{ width:18px; height:18px; stroke:var(--accent-gold); }
  .stat-tile.learned .icon-wrap svg{ stroke:var(--accent-indigo); }
  .stat-tile .num{ font-family:'Poppins',sans-serif; font-weight:700; font-size:24px; line-height:1; color:var(--ink); }
  .stat-tile .num .unit{ font-size:13px; font-weight:500; color:var(--ink-soft); margin-left:2px; }
  .stat-tile .cap{ font-family:'Noto Sans JP',sans-serif; font-size:11.5px; color:var(--ink-soft); font-weight:500; }

  .section-label{ font-family:'Noto Sans JP',sans-serif; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; margin: 20px 2px 10px; }

  .progress-bar{ width:100%; height:5px; border-radius:4px; background:var(--card-border); overflow:hidden; }
  .progress-bar span{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent-gold),var(--accent-sakura)); transition:width .4s var(--ease); }

  /* Accent styling */
  .accent-gold .emblem, .accent-gold .g-icon, .g-icon.accent-gold{ background:linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); }
  .accent-indigo .emblem, .accent-indigo .g-icon, .g-icon.accent-indigo{ background:linear-gradient(155deg, var(--accent-indigo), var(--accent-gold)); }
  .accent-sakura .emblem, .accent-sakura .g-icon, .g-icon.accent-sakura{ background:linear-gradient(155deg, var(--accent-sakura-deep), var(--accent-indigo)); }
  .accent-gold{ --tile-glow: var(--accent-gold); }
  .accent-indigo{ --tile-glow: var(--accent-indigo); }
  .accent-sakura{ --tile-glow: var(--accent-sakura-deep); }

  /* ============ HERO TILES ============ */
  .bab-tile{ display:block; width:100%; text-align:left; border:1px solid var(--card-border); background:var(--card-bg); border-radius:var(--radius-xl); padding:20px; box-shadow:var(--shadow-soft); cursor:pointer; position:relative; overflow:hidden; margin-bottom:14px; color:var(--ink); }
  .bab-tile .glow{ position:absolute; width:170px; height:170px; border-radius:50%; filter:blur(6px); opacity:.3; top:-60px; right:-50px; background: radial-gradient(circle, var(--tile-glow, var(--accent-indigo)), transparent 70%); }
  .bab-tile .emblem{ width:54px; height:54px; border-radius:17px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; position:relative; z-index:1; box-shadow:0 8px 18px rgba(0,0,0,.12); }
  .bab-tile .emblem svg{ width:27px; height:27px; stroke:#fff; }
  .bab-tile .eyebrow{ position:relative; z-index:1; font-family:'Noto Sans JP',sans-serif; font-size:10.5px; letter-spacing:.14em; font-weight:600; color:var(--ink-faint); text-transform:uppercase; }
  .bab-tile .bab-title{ position:relative; z-index:1; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:19px; margin:4px 0 6px; color:var(--ink); line-height:1.25; }
  .bab-tile .bab-desc{ position:relative; z-index:1; font-family:'Noto Sans JP',sans-serif; font-size:12px; color:var(--ink-soft); line-height:1.55; margin-bottom:16px; max-width:94%; }
  .bab-tile .bab-meta{ position:relative; z-index:1; display:flex; gap:18px; margin-bottom:12px; }
  .bab-tile .bab-meta .meta-num{ font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:var(--ink); }
  .bab-tile .bab-meta .meta-label{ font-family:'Noto Sans JP',sans-serif; font-size:10px; color:var(--ink-faint); }
  .bab-tile .bab-progress{ position:relative; z-index:1; }

  .bab-tile.accent-gold{ background: linear-gradient(150deg, color-mix(in srgb, var(--accent-gold) 20%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-sakura-deep) 10%, var(--card-bg)) 100%); border-color: color-mix(in srgb, var(--accent-gold) 35%, var(--card-border)); }
  .bab-tile.accent-indigo{ background: linear-gradient(150deg, color-mix(in srgb, var(--accent-indigo) 20%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-gold) 10%, var(--card-bg)) 100%); border-color: color-mix(in srgb, var(--accent-indigo) 35%, var(--card-border)); }
  .bab-tile.accent-sakura{ background: linear-gradient(150deg, color-mix(in srgb, var(--accent-sakura-deep) 20%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-indigo) 10%, var(--card-bg)) 100%); border-color: color-mix(in srgb, var(--accent-sakura-deep) 35%, var(--card-border)); }

  .bab-tile.test-cta{
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent-indigo) 20%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-sakura-deep) 14%, var(--card-bg)) 50%, color-mix(in srgb, var(--accent-gold) 14%, var(--card-bg)) 100%);
    border-color: color-mix(in srgb, var(--accent-indigo) 35%, var(--card-border));
    --tile-glow: var(--accent-indigo);
  }
  .bab-tile.test-cta .emblem{ background: linear-gradient(155deg, var(--accent-indigo), var(--accent-sakura-deep)); }

  .bab-tile.bunpou-cta{
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent-sakura-deep) 22%, var(--card-bg)) 0%, color-mix(in srgb, var(--accent-gold) 14%, var(--card-bg)) 100%);
    border-color: color-mix(in srgb, var(--accent-sakura-deep) 35%, var(--card-border));
    --tile-glow: var(--accent-sakura-deep);
  }
  .bab-tile.bunpou-cta .emblem{ background: linear-gradient(155deg, var(--accent-sakura-deep), var(--accent-gold)); }

  /* ============ GROUP ROWS ============ */
  .group-row{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); padding:14px 14px; box-shadow:var(--shadow-soft); cursor:pointer; margin-bottom:10px; }
  .group-row .g-icon{ width:46px; height:46px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .group-row .g-icon svg{ width:21px; height:21px; stroke:#fff; }
  .group-row .g-body{ flex:1; min-width:0; }
  .group-row .g-title{ font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:14px; color:var(--ink); margin-bottom:2px; }
  .group-row .g-desc{ font-family:'Noto Sans JP',sans-serif; font-size:11.5px; color:var(--ink-soft); margin-bottom:7px; line-height:1.4; }
  .group-row .g-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .group-row .g-tag{ font-family:'Poppins',sans-serif; font-size:9.5px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--card-bg-soft); color:var(--ink-soft); border:1px solid var(--card-border); white-space:nowrap; }
  .group-row .g-tag.page-tag{ background:rgba(198,150,87,.18); color:var(--accent-gold); border-color:transparent; font-weight:700; }
  .group-row .g-tag.done{ background:rgba(79,157,110,.16); color:var(--color-correct); border-color:transparent; }
  .group-row .g-chevron{ flex-shrink:0; opacity:.45; }
  .group-row .g-chevron svg{ width:16px; height:16px; stroke:var(--ink-soft); }

  .group-row.accent-gold{ background: linear-gradient(120deg, color-mix(in srgb, var(--accent-gold) 14%, var(--card-bg)) 0%, var(--card-bg) 65%); border-color: color-mix(in srgb, var(--accent-gold) 28%, var(--card-border)); }
  .group-row.accent-indigo{ background: linear-gradient(120deg, color-mix(in srgb, var(--accent-indigo) 14%, var(--card-bg)) 0%, var(--card-bg) 65%); border-color: color-mix(in srgb, var(--accent-indigo) 28%, var(--card-border)); }
  .group-row.accent-sakura{ background: linear-gradient(120deg, color-mix(in srgb, var(--accent-sakura-deep) 14%, var(--card-bg)) 0%, var(--card-bg) 65%); border-color: color-mix(in srgb, var(--accent-sakura-deep) 28%, var(--card-border)); }

  /* ============ BACK ROW ============ */
  .back-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .back-btn{ width:36px; height:36px; border-radius:12px; background:var(--card-bg); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-soft); cursor:pointer; flex-shrink:0; }
  .back-btn svg{ width:16px; height:16px; stroke:var(--ink-soft); }
  .crumb{ display:flex; flex-direction:column; gap:1px; min-width:0; flex:1; }
  .crumb .eyebrow{ font-family:'Noto Sans JP',sans-serif; font-size:10.5px; letter-spacing:.12em; font-weight:600; color:var(--ink-faint); text-transform:uppercase; }
  .crumb .crumb-title{ font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:17px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ============ FLASHCARD ============ */
  .meta-bar{ padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .meta-bar .meta-left{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .meta-bar .meta-cat{ font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta-bar .meta-page{ font-family:'Poppins',sans-serif; font-size:11px; font-weight:600; color:var(--accent-gold); }
  .meta-bar .meta-right{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:78px; }
  .meta-bar .meta-count{ font-family:'Poppins',sans-serif; font-size:11px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }

  .flashcard{ position:relative; perspective:1400px; height:254px; cursor:pointer; margin-bottom:18px; }
  .exclude-btn{ position:absolute; top:-12px; right:-8px; z-index:6; width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:var(--card-bg); border:1px solid var(--card-border); box-shadow:var(--shadow-soft); cursor:pointer; transition:var(--transition), transform .2s var(--ease); }
  .exclude-btn svg{ width:15px; height:15px; stroke:var(--ink-soft); }
  .exclude-btn:active{ transform:scale(.9); }
  .exclude-btn.is-excluded{ background: linear-gradient(155deg, var(--accent-gold), var(--accent-sakura-deep)); border-color:transparent; }
  .exclude-btn.is-excluded svg{ stroke:#fff; }
  .flashcard-inner{ position:relative; width:100%; height:100%; transition: transform .65s var(--ease); transform-style:preserve-3d; }
  .flashcard.flipped .flashcard-inner{ transform: rotateY(180deg); }
  .face{ position:absolute; inset:0; border-radius:var(--radius-xl); backface-visibility:hidden; -webkit-backface-visibility:hidden; padding:18px; display:flex; flex-direction:column; background:var(--card-bg); border:1px solid var(--card-border); box-shadow:var(--shadow-card); transition:var(--transition); overflow:hidden; }
  .face.back{ transform: rotateY(180deg); }

  .face-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .face-top-left{ display:flex; align-items:center; gap:6px; min-width:0; }
  .badge{ font-family:'Noto Sans JP',sans-serif; font-size:10px; font-weight:600; padding:5px 10px; border-radius:999px; background: rgba(198,150,87,.14); color:var(--accent-gold); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge.blue{ background:rgba(61,90,120,.12); color:var(--accent-indigo); }
  .badge.sakura{ background:rgba(209,99,126,.14); color:var(--accent-sakura-deep); }

  .learned-badge{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, var(--accent-gold), var(--accent-sakura-deep)); opacity:0; transform:scale(.4); transition: opacity .35s var(--ease), transform .35s var(--ease); flex-shrink:0; }
  .learned-badge svg{ width:11px; height:11px; stroke:#fff; }
  .flashcard.is-learned .learned-badge{ opacity:1; transform:scale(1); }

  .face-mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; overflow-y:auto; padding:4px 0; }
  .kana-word{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:28px; font-weight:700; color:var(--ink); line-height:1.25; }
  .kana-romaji{ font-family:'Poppins',sans-serif; font-size:13px; font-weight:500; color:var(--ink-faint); }
  .kanji-display{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:62px; font-weight:900; color:var(--ink); line-height:1; }

  .face-bottom{ display:flex; align-items:center; justify-content:center; gap:6px; flex-shrink:0; }
  .flip-hint{ font-family:'Noto Sans JP',sans-serif; font-size:10.5px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; }
  .flip-hint svg{ width:11px; height:11px; stroke:var(--ink-faint); }

  .arti-label{ font-family:'Noto Sans JP',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-sakura-deep); }
  .arti-text{ font-family:'Poppins',sans-serif; font-weight:700; font-size:18px; color:var(--ink); line-height:1.35; padding:0 4px; }

  /* ============ NAV ROW ============ */
  .nav-row{ display:grid; grid-template-columns:1fr auto 1fr; gap:var(--gap); align-items:center; }
  .shuffle-btn{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--card-bg); border:1.5px dashed var(--card-border); box-shadow:var(--shadow-soft); cursor:pointer; flex-shrink:0; transition:var(--transition), transform .25s var(--ease); }
  .shuffle-btn svg{ width:19px; height:19px; stroke:var(--ink-soft); }
  .shuffle-btn.is-active{ background: linear-gradient(155deg, var(--accent-indigo), var(--accent-sakura-deep)); border-style:solid; border-color:transparent; }

const STORE = { theme:'waFlashcards.theme', learned:'waFlashcards.learnedIds_n5', excluded:'waFlashcards.excludedIds_n5', streak:'waFlashcards.streakCount', lastVisit:'waFlashcards.lastVisit' };
function safeGet(k, fb){ try{ const r = localStorage.getItem(k); return r === null ? fb : JSON.parse(r); }catch(e){ return fb; } }
function safeSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let learnedSet = new Set(safeGet(STORE.learned, []));
function saveLearned(){ safeSet(STORE.learned, Array.from(learnedSet)); }
let excludedSet = new Set(safeGet(STORE.excluded, []));
function saveExcluded(){ safeSet(STORE.excluded, Array.from(excludedSet)); }
function cardUid(gid, idx){ return gid + '#' + idx; }

function totalCardsInGroup(g){ return g.cards.length; }
function learnedCountInGroup(g){ return g.cards.reduce((n,_,i)=> n + (learnedSet.has(cardUid(g.id,i)) ? 1 : 0), 0); }
function totalCardsInChapter(c){ return c.groups.reduce((s,g)=> s + totalCardsInGroup(g), 0); }
function learnedCountInChapter(c){ return c.groups.reduce((s,g)=> s + learnedCountInGroup(g), 0); }
function totalCardsAll(){ return CHAPTERS.reduce((s,c)=> s + totalCardsInChapter(c), 0); }
function learnedCountAll(){ return CHAPTERS.reduce((s,c)=> s + learnedCountInChapter(c), 0); }

/* Text-to-Speech */
function speakKana(htmlStr){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const temp = document.createElement('div');
    temp.innerHTML = htmlStr;
    const rts = temp.querySelectorAll('rt');
    rts.forEach(r => r.remove());
    const cleanText = temp.textContent.replace(/\[.*?\]/g, '').replace(/[\(\)]/g, '').trim();
    const ut = new SpeechSynthesisUtterance(cleanText);
    ut.lang = 'ja-JP';
    ut.rate = 0.85;
    window.speechSynthesis.speak(ut);
  }
}

/* ============================================================
   QUIZ SYSTEM
   ============================================================ */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function collectPool(chapterIds, kanjiOnly){
  let pool = [];
  chapterIds.forEach(cid => {
    const chap = CHAPTERS.find(c => c.id === cid);
    chap.groups.forEach(g => {
      const isKanji = g.id.endsWith('gk');
      if(kanjiOnly && !isKanji) return;
      if(!kanjiOnly && isKanji) return;
      g.cards.forEach(card => pool.push({ card, groupId: g.id, chapterId: cid }));
    });
  });
  return pool;
}

function quizPair(card){
  if(card.type === 'kanji') return { jp: card.contohJp, jpSub: card.kanji, id: card.contohId };
  return { jp: card.kana, jpSub: card.romaji, id: card.arti };
}

function pickDistractors(pool, target, count){
  const same = pool.filter(p => p.groupId === target.groupId && p.card !== target.card);
  let cand = shuffleArray(same).slice(0, count);
  if(cand.length < count){
    const chosen = new Set(cand.map(c=>c.card));
    const rest = pool.filter(p => p.card !== target.card && !chosen.has(p.card));
    cand = cand.concat(shuffleArray(rest).slice(0, count - cand.length));
  }
  return cand;
}

  bab10: { label: 'Bab 10 (70 Kotoba)', desc: 'Urutan tindakan & aspek perubahan (Halaman 67, 69, 72)', icon: 'book', accent: 'accent-gold', build: () => collectPool(['bab10'], false) },
  bab11: { label: 'Bab 11 (34 Kotoba)', desc: 'Perbandingan, cuaca & musim (Halaman 75)', icon: 'scale', accent: 'accent-indigo', build: () => collectPool(['bab11'], false) },
  bab12: { label: 'Bab 12 (46 Kotoba)', desc: 'Sebab akibat, emosi & bencana (Halaman 79)', icon: 'cause', accent: 'accent-sakura', build: () => collectPool(['bab12'], false) },
  all: { label: 'Semua Bab (150 Kotoba)', desc: 'Gabungan lengkap Bab 10, 11, dan 12', icon: 'layers', accent: 'accent-gold', build: () => collectPool(['bab10','bab11','bab12'], false) },
  kanji: { label: 'Semua Kanji Harian (28)', desc: 'Gabungan 28 Kanji Harian Bab 10, 11 & 12', icon: 'hanko', accent: 'accent-indigo', build: () => collectPool(['bab10','bab11','bab12'], true) }
};
const SCOPE_KEYS = ['bab10','bab11','bab12','all','kanji'];

function buildMCQuestions(scopeKey){
  const pool = SCOPES[scopeKey].build();
  let qs = [];
  pool.forEach(item => {
    ['jp2id','id2jp'].forEach(dir => {
      const distractors = pickDistractors(pool, item, 3);
      const options = shuffleArray([item, ...distractors]).map(o => {
        const p = quizPair(o.card);
        return { text: dir==='jp2id' ? p.id : p.jp, sub: dir==='id2jp' ? p.jpSub : null, correct: o.card === item.card };
      });
      const pair = quizPair(item.card);
      qs.push({
        direction: dir, item, options,
        promptMain: dir==='jp2id' ? pair.jp : pair.id,
        promptSub: dir==='jp2id' ? pair.jpSub : null,
        kanjiGlyph: item.card.type === 'kanji' ? item.card.kanji : null
      });
    });
  });
  return shuffleArray(qs);
}

function buildMatchingRounds(scopeKey, roundSize){
  const pool = shuffleArray(SCOPES[scopeKey].build());
  const rounds = [];
  for(let i=0; i<pool.length; i+=roundSize) rounds.push(pool.slice(i, i+roundSize));
  return rounds;
}

const state = { screen: 'home', chapterId: null, groupId: null, cardIndex: 0, order: null, shuffled: false, quiz: null, bunpouTab: 'b10' };
const screenEl = document.getElementById('screen');

function goHome(){ state.screen = 'home'; state.chapterId = null; state.groupId = null; render(); }
function goChapter(cid){ state.screen = 'chapter'; state.chapterId = cid; state.groupId = null; render(); }
function goDeck(cid, gid){
  state.screen = 'deck'; state.chapterId = cid; state.groupId = gid; state.cardIndex = 0; state.shuffled = false;
  const chap = CHAPTERS.find(c => c.id === cid);
  const g = chap.groups.find(gr => gr.id === gid);
  state.order = g.cards.map((_,i)=>i);
  render();
}
function goBunpouViewer(tab){ state.screen = 'bunpou'; if(tab) state.bunpouTab = tab; render(); }
function goTestHub(){ state.screen = 'test-hub'; render(); }
function goQuizMode(sKey){ state.screen = 'quiz-mode'; state.pendingScope = sKey; render(); }

function startMCQuiz(sKey){
  state.quiz = { mode:'mc', scopeKey:sKey, questions:buildMCQuestions(sKey), index:0, correct:0, wrong:0, answered:false };
  state.screen = 'quiz-play';
  render();
}
function startMatchQuiz(sKey){
  const rounds = buildMatchingRounds(sKey, 5);
  state.quiz = { mode:'match', scopeKey:sKey, rounds, roundIndex:0, leftOrder:null, rightOrder:null, matched:new Set(), selected:null, mistakes:0, roundsCleared:0 };
  setupMatchRound();
  state.screen = 'quiz-play';
  render();
}
function setupMatchRound(){
  const q = state.quiz;
  const round = q.rounds[q.roundIndex];
  q.leftOrder = shuffleArray(round.map((_,i)=>i));
  q.rightOrder = shuffleArray(round.map((_,i)=>i));
  q.matched = new Set();
  q.selected = null;
}
function exitQuiz(){
  if(state.quiz && !state.quiz.finished){
    if(!confirm('Yakin ingin mengakhiri latihan? Skor belum tersimpan.')) return;
  }

function quizHeaderHtml(title, sub){
  const q = state.quiz;
  return `
    <div class="back-row">
      <button class="back-btn" id="exitQuiz"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon('close')}</svg></button>
      <div class="crumb">
        <span class="eyebrow">${sub}</span>
        <span class="crumb-title">${title}</span>
      </div>
      <div style="display:flex;gap:6px;">
        <span class="score-chip correct">${q.correct !== undefined ? q.correct : q.roundsCleared}</span>
        <span class="score-chip wrong">${q.wrong !== undefined ? q.wrong : q.mistakes}</span>
      </div>
    </div>`;
}

function renderQuizMC(){
  const q = state.quiz;
  if(q.index >= q.questions.length){ renderQuizResult(); return; }
  const question = q.questions[q.index];
  const s = SCOPES[q.scopeKey];
  const dirLabel = question.direction === 'jp2id' ? 'Jepang → Indonesia' : 'Indonesia → Jepang';

  const optsHtml = question.options.map((opt, i) => `
    <button class="quiz-option" data-mc-option="${i}">
      <span><span>${opt.text}</span>${opt.sub ? `<span style="display:block;font-size:10.5px;color:var(--ink-faint);margin-top:2px;">${opt.sub}</span>` : ''}</span>
      <span class="opt-check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${icon('check')}</svg></span>
    </button>`).join('');

  screenEl.innerHTML = `
    <div class="screen-inner">
      ${quizHeaderHtml(s.label, `Pilihan Ganda · ${dirLabel}`)}
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-bottom:6px;">
          <span>SOAL ${q.index+1} DARI ${q.questions.length}</span>
        </div>
        <div class="progress-bar"><span style="width:${(q.index/q.questions.length)*100}%"></span></div>
      </div>
      <div class="bento quiz-question">
        <span style="font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:8px;">${question.direction==='jp2id' ? 'Apa artinya?' : 'Bahasa Jepangnya apa?'}</span>
        ${question.kanjiGlyph ? `<div style="font-size:42px;font-weight:900;margin-bottom:6px;">${question.kanjiGlyph}</div>` : ''}
        <div style="font-size:22px;font-weight:700;line-height:1.3;">${question.promptMain}</div>
        ${question.promptSub ? `<div style="font-size:12px;color:var(--ink-faint);margin-top:4px;">${question.promptSub}</div>` : ''}
      </div>
      <div id="quizOptions">${optsHtml}</div>
    </div>`;
}

function renderQuizMatch(){
  const q = state.quiz;
  const round = q.rounds[q.roundIndex];
  const s = SCOPES[q.scopeKey];

  function tileClass(side, i){
    if(q.matched.has(i)) return 'is-correct';
    if(q.selected && q.selected.side===side && q.selected.idx===i) return 'is-selected';
    if(q.wrongFlash && ((q.wrongFlash.a.side===side && q.wrongFlash.a.idx===i) || (q.wrongFlash.b.side===side && q.wrongFlash.b.idx===i))) return 'is-wrong';
    return '';
  }

  const leftHtml = q.leftOrder.map(i => {
    const item = round[i];
    const pair = quizPair(item.card);
    return `<button class="match-tile ${tileClass('left',i)}" data-match-side="left" data-match-idx="${i}" ${q.matched.has(i)?'disabled':''}>${pair.jp}${pair.jpSub?`<span style="display:block;font-size:9px;color:var(--ink-faint);">${pair.jpSub}</span>`:''}</button>`;
  }).join('');

  const rightHtml = q.rightOrder.map(i => {
    const item = round[i];
    const pair = quizPair(item.card);
    return `<button class="match-tile ${tileClass('right',i)}" data-match-side="right" data-match-idx="${i}" ${q.matched.has(i)?'disabled':''}>${pair.id}</button>`;
  }).join('');

  screenEl.innerHTML = `
    <div class="screen-inner">
      ${quizHeaderHtml(s.label, 'Pasangan Jawaban')}
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-bottom:6px;">
          <span>RONDE ${q.roundIndex+1} DARI ${q.rounds.length}</span>
        </div>
        <div class="progress-bar"><span style="width:${(q.roundIndex/q.rounds.length)*100}%"></span></div>
      </div>
      <div class="match-columns">
        <div class="match-col">${leftHtml}</div>
        <div class="match-col">${rightHtml}</div>
      </div>
    </div>`;
}

function renderQuizResult(){
  const q = state.quiz;
  q.finished = true;
  let scoreBig, scoreLabel;
  if(q.mode === 'match'){
    scoreBig = q.rounds.length;
    scoreLabel = `${q.rounds.length} Ronde Selesai (${q.mistakes} kesalahan)`;
  } else {
    const pct = Math.round((q.correct/q.questions.length)*100);
    scoreBig = pct + '%';
    scoreLabel = `${q.correct} benar dari ${q.questions.length} soal`;
  }

  screenEl.innerHTML = `
    <div class="screen-inner">
      <div class="bento result-card">
        <div class="r-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon('trophy')}</svg></div>
        <div class="r-score">${scoreBig}</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${scoreLabel}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
        <button class="nav-btn primary" id="retryQuiz">Ulangi Latihan</button>
        <button class="nav-btn" id="backTestHubFromResult">Kembali ke Menu Latihan</button>
      </div>
    </div>`;
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'chapter') renderChapter(state.chapterId);
  else if(state.screen === 'deck') renderDeck(state.chapterId, state.groupId);
  else if(state.screen === 'bunpou') renderBunpou();
  else if(state.screen === 'test-hub') renderTestHub();
  else if(state.screen === 'quiz-mode') renderQuizMode();
  else if(state.screen === 'quiz-play') renderQuizPlay();
}

screenEl.addEventListener('click', (e)=>{
  const openChap = e.target.closest('[data-open-chapter]');
  if(openChap){ goChapter(openChap.getAttribute('data-open-chapter')); return; }

  const openDeck = e.target.closest('[data-open-deck]');
  if(openDeck){ goDeck(state.chapterId, openDeck.getAttribute('data-open-deck')); return; }

  const openQuizMode = e.target.closest('[data-open-quiz-mode]');
  if(openQuizMode){ goQuizMode(openQuizMode.getAttribute('data-open-quiz-mode')); return; }

  const setBTab = e.target.closest('[data-set-btab]');
  if(setBTab){ state.bunpouTab = setBTab.getAttribute('data-set-btab'); renderBunpou(); return; }

  if(e.target.closest('#openBunpou')){ goBunpouViewer(); return; }
  if(e.target.closest('#openTestHub')){ goTestHub(); return; }
  if(e.target.closest('#backTestHub')){ goTestHub(); return; }
  if(e.target.closest('#backTestHubFromResult')){ goTestHub(); return; }
  if(e.target.closest('#exitQuiz')){ exitQuiz(); return; }

  const startMc = e.target.closest('[data-start-mc]');
  if(startMc){ startMCQuiz(startMc.getAttribute('data-start-mc')); return; }

  const startMatch = e.target.closest('[data-start-match]');
  if(startMatch){ startMatchQuiz(startMatch.getAttribute('data-start-match')); return; }

  if(e.target.closest('#retryQuiz')){
    if(state.quiz.mode === 'mc') startMCQuiz(state.quiz.scopeKey);
    else startMatchQuiz(state.quiz.scopeKey);
    return;
  }

  const mcOpt = e.target.closest('[data-mc-option]');
  if(mcOpt){
    const q = state.quiz;
    if(q.answered) return;
    q.answered = true;
    const optIdx = parseInt(mcOpt.getAttribute('data-mc-option'), 10);
    const question = q.questions[q.index];
    const chosen = question.options[optIdx];
    screenEl.querySelectorAll('[data-mc-option]').forEach((btn, i) => {
      btn.classList.add('is-disabled');
      if(question.options[i].correct) btn.classList.add('is-correct');
      else if(i === optIdx) btn.classList.add('is-wrong');
    });
    if(chosen.correct) q.correct++; else q.wrong++;
    setTimeout(() => { q.index++; q.answered = false; renderQuizPlay(); }, 850);
    return;
  }

  const matchTile = e.target.closest('[data-match-side]');
  if(matchTile && !matchTile.disabled){
    const q = state.quiz;
    if(q.wrongFlash) return;
    const side = matchTile.getAttribute('data-match-side');
    const idx = parseInt(matchTile.getAttribute('data-match-idx'), 10);

    if(!q.selected || q.selected.side === side){ q.selected = {side, idx}; renderQuizMatch(); return; }

    const prev = q.selected;
    if(prev.idx === idx){
      q.matched.add(idx);
      q.selected = null;
      renderQuizMatch();
      if(q.matched.size === q.rounds[q.roundIndex].length){
        setTimeout(()=>{
          q.roundIndex++;
          q.roundsCleared = q.roundIndex;
          if(q.roundIndex >= q.rounds.length) renderQuizResult();
          else { setupMatchRound(); renderQuizPlay(); }
        }, 500);
      }
    } else {
      q.mistakes++;
      q.wrongFlash = { a: prev, b: {side, idx} };
      q.selected = null;
      renderQuizMatch();
      setTimeout(()=>{ q.wrongFlash = null; renderQuizMatch(); }, 500);
    }
    return;
  }

  if(e.target.closest('#backHome')){ goHome(); return; }
  if(e.target.closest('#backChapter')){ goChapter(state.chapterId); return; }

  if(e.target.closest('#shuffleDeck')){
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    const g = chap.groups.find(gr => gr.id === state.groupId);
    let pool = g.cards.map((_,i)=>i).filter(i => !excludedSet.has(cardUid(g.id, i)));
    if(pool.length === 0) pool = g.cards.map((_,i)=>i);
    state.order = shuffleArray(pool);
    state.cardIndex = 0;
    state.shuffled = true;
    renderDeck(state.chapterId, state.groupId);
    return;
  }

  if(e.target.closest('#resetProgress')){
    if(confirm('Setel ulang seluruh progres hafalan Bab 10, 11 & 12?')){
      Object.values(STORE).forEach(k => localStorage.removeItem(k));
      location.reload();
    }
    return;
  }

  const prevBtn = e.target.closest('#prevCard');
  if(prevBtn && !prevBtn.disabled){ state.cardIndex = Math.max(0, state.cardIndex-1); renderDeck(state.chapterId, state.groupId); return; }

  const nextBtn = e.target.closest('#nextCard');
  if(nextBtn && !nextBtn.disabled){ state.cardIndex = Math.min(state.order.length-1, state.cardIndex+1); renderDeck(state.chapterId, state.groupId); return; }

  const soundBtn = e.target.closest('.sound-btn');
  if(soundBtn){
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    const g = chap.groups.find(gr => gr.id === state.groupId);
    const card = g.cards[state.order[state.cardIndex]];
    speakKana(card.type === 'kanji' ? card.contohJp : card.kana);
    return;
  }

  const exBtn = e.target.closest('#excludeCard');
  if(exBtn){
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    const g = chap.groups.find(gr => gr.id === state.groupId);
    const uid = cardUid(g.id, state.order[state.cardIndex]);
    if(excludedSet.has(uid)) excludedSet.delete(uid); else excludedSet.add(uid);
    saveExcluded();
    renderDeck(state.chapterId, state.groupId);
    return;
  }

  const cardEl = e.target.closest('#activeCard');
  if(cardEl){
    cardEl.classList.toggle('flipped');
    const chap = CHAPTERS.find(c => c.id === state.chapterId);
    const g = chap.groups.find(gr => gr.id === state.groupId);
    const uid = cardUid(g.id, state.order[state.cardIndex]);
    if(cardEl.classList.contains('flipped') && !learnedSet.has(uid)){
      learnedSet.add(uid);
      cardEl.classList.add('is-learned');
      saveLearned();
    }
    return;
  }
});

/* ============================================================
   THEME & STREAK
   ============================================================ */
const app = document.getElementById('app');
const toggle = document.getElementById('themeToggle');
const knobIcon = document.getElementById('knobIcon');
const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moonPath = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';

function applyTheme(t){ app.setAttribute('data-theme', t); knobIcon.innerHTML = t==='dark' ? moonPath : sunPath; }
applyTheme(safeGet(STORE.theme, 'light'));
toggle.addEventListener('click', ()=>{ const next = app.getAttribute('data-theme')==='dark'?'light':'dark'; applyTheme(next); safeSet(STORE.theme, next); });

(function updateStreak(){
  const todayKey = new Date().toDateString();
  const lastVisit = safeGet(STORE.lastVisit, null);
  let streak = safeGet(STORE.streak, 0);
  if(lastVisit !== todayKey){
    const y = new Date(); y.setDate(y.getDate()-1);
    streak = (lastVisit === y.toDateString()) ? streak+1 : 1;
    safeSet(STORE.streak, streak); safeSet(STORE.lastVisit, todayKey);
  } else if(!streak){
    streak = 1; safeSet(STORE.streak, streak); safeSet(STORE.lastVisit, todayKey);
  }
})();

/* ============================================================
   PETALS ANIMATION
   ============================================================ */
const petalHost = document.getElementById('petals');
for(let i=0; i<10; i++){
  const p = document.createElement('div'); p.className = 'petal';
  p.style.left = (Math.random()*100)+'%';
  const s = 6+Math.random()*6;
  p.style.width = s+'px'; p.style.height = s+'px';
  p.style.setProperty('--drift', (Math.random()*60-30)+'px');
  p.style.animationDuration = (7+Math.random()*6)+'s';
  p.style.animationDelay = (Math.random()*-12)+'s';
  petalHost.appendChild(p);
}

render();
</script>
